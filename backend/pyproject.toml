[project]
name = "osher-ai-twin-backend"
version = "0.1.0"
description = "FastAPI backend for Osher's portfolio - Osher's AI Twin agent + resume/GitHub APIs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.69",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "slowapi>=0.1.9",
]

[tool.uv]
package = false
